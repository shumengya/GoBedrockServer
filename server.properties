# Go MC Server 配置文件
# 修改后重启生效；命令行参数（如 -port）优先于本文件。

# 服务器名称，显示在服务器列表里（不要写分号）
motd=一个由go语言开发的minecraft服务器
# UDP 端口
server-port=19132
# 绑定地址，0.0.0.0 表示所有网卡
server-ip=0.0.0.0
# 最大玩家数，0 表示不限制
max-players=20
# 新玩家的默认游戏模式：0 / survival 生存，1 / creative 创造
gamemode=0
# 难度：0 和平，1 简单，2 普通，3 困难
difficulty=1
# 客户端视距上限（区块），范围 2–32；越大越吃 CPU 和流量
view-distance=4
# 玩家之间能否互相攻击
pvp=on
# 火焰是否自然老化、蔓延和烧毁相邻方块
fire-spread=off
# 是否开启白名单（名单见 white-list.txt，管理员不受限）
white-list=off
# 出生点保护半径（方块），0 关闭
spawn-protection=16
